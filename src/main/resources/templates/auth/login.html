<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Tournoi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f5f5; }
        .login-card { max-width: 400px; margin: 100px auto; }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h3 class="text-center mb-4">Gestion de Tournois</h3>

                    <div th:if="${param.error}" class="alert alert-danger">
                        Identifiant ou mot de passe incorrect.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success">
                        Vous êtes déconnecté.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Identifiant</label>
                            <input type="text" class="form-control" name="username" required autofocus/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mot de passe</label>
                            <input type="password" class="form-control" name="password" required/>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Se connecter</button>
                    </form>

                    <div class="mt-4 p-3 bg-light rounded">
                        <h6>Comptes de démo :</h6>
                        <small class="text-muted d-block">admin / admin123 (ADMIN)</small>
                        <small class="text-muted d-block">manager / manager123 (MANAGER)</small>
                        <small class="text-muted d-block">operator / operator123 (OPERATOR)</small>
                        <small class="text-muted d-block">user / user123 (USER)</small>
                        <small class="text-muted d-block">demo / demo123 (ALL ROLES)</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
