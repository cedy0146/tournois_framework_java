<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">
<div th:fragment="content">
    <section class="app-page-head reveal">
        <span class="eyebrow">Classement</span>
        <h1>Classement <em class="lp-accent lp-accent--plain">du tournoi</em></h1>
        <p th:if="${tournament != null and tournament.criteresClassement != null and !tournament.criteresClassement.isEmpty()}"
           style="font-size: 0.875rem; color: var(--muted);">
            <strong>Critères:</strong>
            <span th:text="${#strings.replace(#strings.replace(tournament.criteresClassement, '_', ' '), ',', ' · ')}"></span>
        </p>
        <p>Résultats et positions de toutes les équipes.</p>
        <div class="btn-group">
            <a th:href="@{/}" class="btn btn-outline-secondary">Accueil</a>
        </div>
    </section>

    <div class="data-card" style="border-radius: 20px; background: var(--card); border: 1px solid var(--line);">
        <div class="table-responsive">
            <table class="table-custom">
                <caption class="visually-hidden">Classement du tournoi</caption>
                <thead>
                    <tr>
                        <th scope="col" style="width: 40px;">#</th>
                        <th scope="col" style="width: 180px;">Équipe</th>
                        <th scope="col" style="width: 30px;">J</th>
                        <th scope="col" style="width: 30px;">G</th>
                        <th scope="col" style="width: 30px;">N</th>
                        <th scope="col" style="width: 30px;">P</th>
                        <th scope="col" style="width: 50px;">Pts</th>
                        <th scope="col" style="width: 40px;">BP</th>
                        <th scope="col" style="display: none;">BC</th>
                        <th scope="col" style="width: 40px;">Diff</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${rankings}">
                        <td>
                            <span class="rank-badge"
                                  th:classappend="${r.classement == 1} ? 'rank-gold' : (${r.classement == 2} ? 'rank-silver' : (${r.classement == 3} ? 'rank-bronze' : 'rank-default'))"
                                  th:text="${r.classement}">1</span>
                        </td>
                        <td class="podium-name">
                            <span class="team-avatar" style="width: 28px; height: 28px; border-radius: 50%; background: rgba(var(--primary-rgb), .15); color: var(--primary-bright); font-weight: 600; display: flex; align-items: center; justify-content: center;">
                                <span th:text="${r.teamInitiales}">A</span>
                            </span>
                            <span th:text="${r.teamNom}">Équipe</span>
                        </td>
                        <td th:text="${r.matchsJoues}">0</td>
                        <td th:text="${r.victoires}">0</td>
                        <td th:text="${r.nuls}">0</td>
                        <td th:text="${r.defaites}">0</td>
                        <td><strong th:text="${r.points}" class="fw-bold">0</strong></td>
                        <td th:text="${r.butsMarques}">0</td>
                        <td style="display: none;" th:text="${r.butsEncaisses}">0</td>
                        <td>
                            <span th:if="${r.diffButs > 0}" class="diff-positive fw-bold" th:text="'+' + ${r.diffButs}">+0</span>
                            <span th:if="${r.diffButs == 0}" th:text="${r.diffButs}">0</span>
                            <span th:if="${r.diffButs < 0}" class="diff-negative" th:text="${r.diffButs}">-0</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:if="${rankings == null or rankings.isEmpty()}" class="empty-state text-center mt-4">
        <i class="bi bi-bar-chart-line"></i>
        <h3>Aucun classement disponible</h3>
        <p>Les résultats doivent encore être saisis pour calculer le classement.</p>
    </div>
</div>
</html>
