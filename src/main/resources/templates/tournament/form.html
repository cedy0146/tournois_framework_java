<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: html}">
<div th:fragment="content">
    <h2 class="mb-4">Nouveau Tournoi</h2>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <form th:action="@{/tournaments}" th:object="${tournament}" method="post" class="card p-4">

                <div class="mb-3">
                    <label class="form-label">Nom *</label>
                    <input type="text" class="form-control" th:field="*{nom}" th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Sport *</label>
                    <input type="text" class="form-control" th:field="*{sport}" th:classappend="${#fields.hasErrors('sport')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('sport')}" th:errors="*{sport}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" th:field="*{description}"></textarea>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Date début *</label>
                        <input type="date" class="form-control" th:field="*{dateDebut}" th:classappend="${#fields.hasErrors('dateDebut')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('dateDebut')}" th:errors="*{dateDebut}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Date fin *</label>
                        <input type="date" class="form-control" th:field="*{dateFin}" th:classappend="${#fields.hasErrors('dateFin')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('dateFin')}" th:errors="*{dateFin}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Lieu</label>
                    <input type="text" class="form-control" th:field="*{lieu}"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nombre max d'équipes *</label>
                    <input type="number" class="form-control" th:field="*{nombreMaxEquipes}" min="2" th:classappend="${#fields.hasErrors('nombreMaxEquipes')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nombreMaxEquipes')}" th:errors="*{nombreMaxEquipes}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Type *</label>
                    <select class="form-select" th:field="*{type}">
                        <option value="">-- Choisir --</option>
                        <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                    </select>
                </div>

                <div class="text-end">
                    <a th:href="@{/tournaments}" class="btn btn-secondary">Annuler</a>
                    <button type="submit" class="btn btn-primary">Créer</button>
                </div>
            </form>
        </div>
    </div>
</div>
</html>
