<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: html}">
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Liste des Tournois</h2>
        <a th:href="@{/tournaments/new}" class="btn btn-primary"
           sec:authorize="hasAnyRole('ADMIN','MANAGER')">Nouveau Tournoi</a>
    </div>

    <div class="table-responsive" th:if="${tournaments != null and !tournaments.content.isEmpty()}">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Nom</th>
                    <th>Sport</th>
                    <th>Type</th>
                    <th>Début</th>
                    <th>Fin</th>
                    <th>Lieu</th>
                    <th>Statut</th>
                    <th>Équipes</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="t : ${tournaments.content}">
                    <td th:text="${t.nom}"></td>
                    <td th:text="${t.sport}"></td>
                    <td th:text="${t.type}"></td>
                    <td th:text="${t.dateDebut}"></td>
                    <td th:text="${t.dateFin}"></td>
                    <td th:text="${t.lieu}"></td>
                    <td><span class="badge bg-info" th:text="${t.statut}"></span></td>
                    <td th:text="${t.nombreEquipesInscrites}"></td>
                    <td>
                        <a th:href="@{/tournaments/{id}(id=${t.id})}" class="btn btn-sm btn-outline-primary">Voir</a>
                        <a th:href="@{/tournaments/{id}/edit(id=${t.id})}" class="btn btn-sm btn-outline-warning"
                           sec:authorize="hasAnyRole('ADMIN','MANAGER')">Modifier</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Pagination -->
        <nav th:if="${tournaments.totalPages > 1}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${tournaments.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/tournaments(page=${tournaments.number - 1})}">Précédent</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, tournaments.totalPages - 1)}"
                    th:classappend="${i == tournaments.number} ? 'active'">
                    <a class="page-link" th:href="@{/tournaments(page=${i})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${tournaments.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/tournaments(page=${tournaments.number + 1})}">Suivant</a>
                </li>
            </ul>
        </nav>
    </div>
    <div th:unless="${tournaments != null and !tournaments.content.isEmpty()}" class="alert alert-info">
        Aucun tournoi trouvé.
    </div>
</div>
</html>
