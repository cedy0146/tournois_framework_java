<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: html}">
<div th:fragment="content">
    <h2 class="mb-4">Modifier l'Équipe</h2>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <form th:action="@{/teams/{id}(id=${team.id})}" method="post" class="card p-4">

                <div class="mb-3">
                    <label class="form-label">Nom</label>
                    <input type="text" class="form-control" name="nom" th:value="${team.nom}"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">Logo (URL)</label>
                    <input type="text" class="form-control" name="logo" th:value="${team.logo}"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">Ville</label>
                    <input type="text" class="form-control" name="ville" th:value="${team.ville}"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">Entraîneur</label>
                    <input type="text" class="form-control" name="entraineur" th:value="${team.entraineur}"/>
                </div>

                <div class="text-end">
                    <a th:href="@{/teams/{id}(id=${team.id})}" class="btn btn-secondary">Annuler</a>
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>
</div>
</html>
