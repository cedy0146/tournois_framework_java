<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">
<div th:fragment="content">
    <section class="app-page-head reveal">
        <h2>Modifier un joueur</h2>
        <div class="btn-group">
            <a th:href="@{/teams/{id}(id=${team.id})}" class="btn btn-outline-secondary">Annuler</a>
        </div>
    </section>

    <div class="card" style="border-radius: 24px; padding: 2rem; background: var(--card);">
        <form th:action="@{/teams/{teamId}/players/{playerId}(teamId=${team.id}, playerId=${playerId})}"
              th:object="${player}" method="post" class="mt-3">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="nom" class="form-label">Nom</label>
                    <input id="nom" type="text" th:field="*{nom}" class="form-control" style="height: 48px; border-radius: 14px; background: var(--card-alt); border: 1px var(--line); padding: 0 1rem;" required>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
                </div>
                <div class="col-md-3">
                    <label for="poste" class="form-label">Poste</label>
                    <select id="poste" th:field="*{poste}" class="form-select" style="height: 48px; border-radius: 14px; background: var(--card-alt); border: 1px var(--line); padding: 0 1rem;" required>
                        <option value="">-- Choisir --</option>
                        <option th:each="position : ${positions}" th:value="${position.name()}" th:text="${position}"></option>
                    </select>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('poste')}" th:errors="*{poste}"></div>
                </div>
                <div class="col-md-3">
                    <label for="numero" class="form-label">Numéro</label>
                    <input id="numero" type="number" min="1" th:field="*{numero}" class="form-control" style="height: 48px; border-radius: 14px; background: var(--card-alt); border: 1px var(--line); padding: 0 1rem;" required>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('numero')}" th:errors="*{numero}"></div>
                </div>
            </div>
            <div class="form-actions">
                <a th:href="@{/teams/{id}(id=${team.id})}" class="btn btn-outline-secondary">Annuler</a>
                <button type="submit" class="btn btn-primary" style="width: auto;">Enregistrer</button>
            </div>
        </form>
    </div>
</div>
</html>
