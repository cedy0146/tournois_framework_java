<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">
<div th:fragment="content">
    <section class="app-page-head reveal">
        <h2>Nouvelle équipe</h2>
        <div class="btn-group">
            <a th:href="@{/teams}" class="btn btn-outline-secondary">Retour</a>
        </div>
    </section>

    <div class="form-panel mx-auto" style="max-width: 760px;">
        <div th:replace="~{:: theForm}"></div>
    </div>
</div>

<form th:fragment="theForm" id="teamCreateForm" th:action="@{/teams}" th:object="${team}" method="post" data-modal-form data-success-message="Équipe créée avec succès">
    <div class="form-grid">
        <div class="form-group full">
            <label class="form-label" for="nom">Nom de l'équipe *</label>
            <input type="text" class="form-control" id="nom" th:field="*{nom}" th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
        </div>

        <div class="form-group">
            <label class="form-label" for="ville">Ville</label>
            <input type="text" class="form-control" id="ville" th:field="*{ville}" />
        </div>

        <div class="form-group">
            <label class="form-label" for="entraineur">Entraîneur</label>
            <input type="text" class="form-control" id="entraineur" th:field="*{entraineur}" />
        </div>

        <div class="form-group full">
            <label class="form-label" for="logo">Logo (URL)</label>
            <input type="text" class="form-control" id="logo" th:field="*{logo}" />
        </div>
    </div>

    <div class="form-actions">
        <a th:href="@{/teams}" class="btn btn-outline-secondary">Annuler</a>
        <button type="submit" class="btn btn-primary">Créer l'équipe</button>
    </div>
</form>

<div th:fragment="modalContent" class="modal-fragment">
    <div class="modal-header">
        <h2 class="modal-title fs-5" id="appModalTitle">Nouvelle équipe</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
    </div>
    <div class="modal-body">
        <div th:if="${error != null}" class="alert custom-alert danger" role="alert">
            <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
            <span th:text="${error}"></span>
        </div>
        <div th:replace="~{:: theForm}"></div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="submit" form="teamCreateForm" class="btn btn-primary">Créer l'équipe</button>
    </div>
</div>
</html>
