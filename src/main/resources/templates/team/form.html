<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: html}">
<div th:fragment="content">
    <h2 class="mb-4">Nouvelle Équipe</h2>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <form th:action="@{/teams}" th:object="${team}" method="post" class="card p-4">

                <div class="mb-3">
                    <label class="form-label">Nom *</label>
                    <input type="text" class="form-control" th:field="*{nom}" th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Logo (URL)</label>
                    <input type="text" class="form-control" th:field="*{logo}"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">Ville</label>
                    <input type="text" class="form-control" th:field="*{ville}"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">Entraîneur</label>
                    <input type="text" class="form-control" th:field="*{entraineur}"/>
                </div>

                <div class="text-end">
                    <a th:href="@{/teams}" class="btn btn-secondary">Annuler</a>
                    <button type="submit" class="btn btn-success">Créer</button>
                </div>
            </form>
        </div>
    </div>
</div>
</html>
