<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: html}">
<div th:fragment="content">
    <h2 class="mb-4">Saisie du résultat</h2>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <div class="text-center mb-4">
                    <h4>
                        <span th:text="${match.equipeDomicileNom}"></span>
                        <span class="mx-3">vs</span>
                        <span th:text="${match.equipeVisiteurNom}"></span>
                    </h4>
                    <p class="text-muted">
                        <span th:text="${match.date}"></span>
                        <span th:if="${match.heure != null}" th:text="' à ' + ${match.heure}"></span>
                        <span class="badge bg-secondary ms-2" th:text="${match.phase}"></span>
                    </p>
                </div>

                <form th:action="@{/tournaments/{tid}/matches/{id}/result(tid=${match.tournamentId}, id=${match.id})}" method="post">
                    <div class="row mb-3">
                        <div class="col text-center">
                            <label class="form-label fw-bold" th:text="${match.equipeDomicileNom}"></label>
                            <input type="number" name="scoreDomicile" class="form-control form-control-lg text-center"
                                   min="0" required placeholder="0"/>
                        </div>
                        <div class="col-auto d-flex align-items-center">
                            <span class="fs-3 fw-bold">-</span>
                        </div>
                        <div class="col text-center">
                            <label class="form-label fw-bold" th:text="${match.equipeVisiteurNom}"></label>
                            <input type="number" name="scoreVisiteur" class="form-control form-control-lg text-center"
                                   min="0" required placeholder="0"/>
                        </div>
                    </div>
                    <div class="text-end">
                        <a th:href="@{/tournaments/{id}/matches(id=${match.tournamentId})}" class="btn btn-secondary">Annuler</a>
                        <button type="submit" class="btn btn-success">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</html>
