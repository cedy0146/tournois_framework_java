<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">
<div th:fragment="content">
    <section class="app-page-head reveal">
        <span class="eyebrow">Saisie du résultat</span>
        <h1>Saisir le résultat <em class="lp-accent lp-accent--plain">match</em></h1>
        <p>Entrez les scores de la rencontre.</p>
        <div class="btn-group">
            <a th:href="@{/tournaments/{id}/matches(id=${match.tournamentId})}" class="btn btn-outline-secondary">Retour</a>
        </div>
    </section>

    <div class="card mx-auto" style="max-width: 640px; border-radius: 24px; padding: 2rem; background: var(--card);">
        <div class="text-center mb-4">
            <span class="section-kicker" th:text="${match.phase}">Phase</span>
            <h3 class="mt-3 mb-2">
                <span th:text="${match.equipeDomicileNom}">Domicile</span>
                <span class="mx-3 text-muted" th:if="${match.scoreDomicile == null}">VS</span>
                <span th:text="${match.equipeVisiteurNom}">Visiteur</span>
            </h3>
            <p class="mb-0 text-muted">
                <span th:text="${match.date}">Date</span>
                <span th:if="${match.heure != null}" th:text="' · ' + ${match.heure}">Heure</span>
            </p>
        </div>

        <form th:action="@{/tournaments/{tid}/matches/{id}/result(tid=${match.tournamentId}, id=${match.id})}" method="post">
            <div class="row align-items-center g-3">
                <div class="col-6 text-center">
                    <label class="form-label small" th:text="${match.equipeDomicileNom}">Domicile</label>
                    <input type="number" name="scoreDomicile" id="scoreDomicile" class="form-control form-control-lg text-center" min="0" required style="height: 64px; font-size: 2rem; width: 110px;"
                           placeholder="0" />
                </div>
                <div class="col-2 text-center">
                    <span class="fs-3 fw-bold text-muted" aria-hidden="true">-</span>
                </div>
                <div class="col-6 text-center">
                    <label class="form-label small" th:text="${match.equipeVisiteurNom}">Visiteur</label>
                    <input type="number" name="scoreVisiteur" id="scoreVisiteur" class="form-control form-control-lg text-center" min="0" required style="height: 64px; font-size: 2rem; width: 110px;"
                           placeholder="0" />
                </div>
            </div>

            <div class="row g-3 mt-4">
                <div class="col-6">
                    <label class="form-label small">Tirs au but</label>
                    <input type="number" name="butsDomicile" class="form-control" style="border-radius: 14px; background: var(--card-alt); border: 1px var(--line); padding: 0.5rem 0.75rem;" min="0" placeholder="0" />
                </div>
                <div class="col-6">
                    <label class="form-label small">Prolongations</label>
                    <select name="prolongation" class="form-select" style="border-radius: 14px; background: var(--card-alt); border: 1px var(--line); padding: 0.5rem 0.75rem;">
                        <option value="">-- Aucun --</option>
                        <option value="oui">Oui</option>
                        <option value="non">Non</option>
                    </select>
                </div>
            </div>

            <div class="form-actions justify-content-end mt-4">
                <a th:href="@{/tournaments/{id}/matches(id=${match.tournamentId})}" class="btn btn-outline-secondary">Annuler</a>
                <button type="submit" class="btn btn-primary w-100">Enregistrer le résultat</button>
            </div>
        </form>
    </div>
</div>
</html>
